<text x="353.2" y="24.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">设 AB 倾斜角为 α，|KF| = p：</text>
<text x="353.2" y="45.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">Rt△PKF 中 ∠KPF = α（两边分别垂直）</text>
<text x="353.2" y="66.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">⇒ |PF| = p / sin α</text>
<text x="353.2" y="87.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">Rt△PFQ 中 ∠PQF = α（PQ ∥ x 轴）</text>
<text x="353.2" y="108.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">⇒ |PQ| = |PF| / sin α = p / sin²α</text>
<text x="353.2" y="129.0" font-family="sans-serif" font-size="12.5" fill="#d97706">⇒ |AB| = 2|PQ| = 2p / sin²α</text>
<text x="353.2" y="150.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">S△PAB = ½|AB|·|PF| = p² / sin³α ≥ p²</text>
</svg>
