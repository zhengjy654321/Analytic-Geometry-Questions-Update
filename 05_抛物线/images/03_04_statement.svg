<text x="365.2" y="24.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">一般位置的阿基米德三角形：</text>
<text x="365.2" y="45.0" font-family="sans-serif" font-size="12.5" fill="#d97706">① ∠PFA = ∠PFB（β = γ）</text>
<text x="365.2" y="66.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">② |PF|² = |AF|·|BF|</text>
<text x="365.2" y="87.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f"></text>
<text x="365.2" y="108.0" font-family="sans-serif" font-size="12.5" fill="#64748b">注意：直线 FP 平分 ∠AFB，但 P 可能在角内，</text>
<text x="365.2" y="129.0" font-family="sans-serif" font-size="12.5" fill="#64748b">也可能在平分线的反向延长线上（如本图）</text>
<text x="365.2" y="150.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">AB 过 F 时 β = γ = 90°，即 PF ⊥ AB</text>
