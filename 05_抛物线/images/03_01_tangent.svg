<text x="421.6" y="24.0" font-family="sans-serif" font-size="12.5" fill="#2563eb">切线 y₁y = p(x + x₁) 中令 y = 0 ⇒ G(−x₁, 0)</text>
<text x="421.6" y="45.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">|FG| = x₁ + p/2 = |FA| = |AA′|（一道杠）</text>
<text x="421.6" y="66.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f"></text>
<text x="421.6" y="87.0" font-family="sans-serif" font-size="12.5" fill="#d97706">△AFG 等腰 ⇒ ∠FAG = ∠FGA</text>
<text x="421.6" y="108.0" font-family="sans-serif" font-size="12.5" fill="#d97706">AA′ ∥ x 轴 ⇒ ∠A′AG = ∠FGA（内错角）</text>
<text x="421.6" y="129.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">⇒ ∠1 = ∠2：切线平分 ∠A′AF（光学性质）</text>
<text x="421.6" y="150.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed">又 |AA′| = |AF| ⇒ 切线是 A′F 的中垂线</text>
