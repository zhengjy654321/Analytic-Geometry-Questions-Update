<text x="365.2" y="24.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">第二步：</text>
<text x="365.2" y="45.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">|PA′| = |PF| = |PB′|（两道杠）</text>
<text x="365.2" y="66.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed">⇒ △PA′B′ 等腰 ⇒ ∠5 = ∠6</text>
<text x="365.2" y="87.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">AA′、BB′ 都垂直准线：</text>
<text x="365.2" y="108.0" font-family="sans-serif" font-size="12.5" fill="#d97706">α = ∠5 + 90°，θ = ∠6 + 90° ⇒ α = θ</text>
<text x="365.2" y="129.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">由第一步 β = α，γ = θ</text>
<text x="365.2" y="150.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">⇒ β = γ，即 ∠PFA = ∠PFB</text>
