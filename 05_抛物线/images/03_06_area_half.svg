<text x="368.4" y="24.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed">紫色：弦 AC、CB 与抛物线围成的 S₁、S₂</text>
<text x="368.4" y="45.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">S = 弦 AB 与抛物线围成的弓形</text>
<text x="368.4" y="66.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">S₁ = ⅔S△NAC，S₂ = ⅔S△MCB，S = ⅔S△PAB</text>
<text x="368.4" y="87.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f"></text>
<text x="368.4" y="108.0" font-family="sans-serif" font-size="12.5" fill="#2563eb">S△ABC（蓝）= S − S₁ − S₂</text>
<text x="368.4" y="129.0" font-family="sans-serif" font-size="12.5" fill="#2563eb">= ⅔(S△PAB − S△NAC − S△MCB)</text>
<text x="368.4" y="150.0" font-family="sans-serif" font-size="12.5" fill="#2563eb">= ⅔(S△PMN + S△ABC)</text>
<text x="368.4" y="171.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">⇒ S△ABC = 2 S△PMN（黄）</text>
