<text x="403.6" y="24.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">第一步（以 A 侧为例）：</text>
<text x="403.6" y="45.0" font-family="sans-serif" font-size="12.5" fill="#2563eb">PA：y₁y = p(x + x₁) ⇒ G(−x₁, 0)</text>
<text x="403.6" y="66.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">|FG| = |OG| + p/2 = x₁ + p/2 = |AF|</text>
<text x="403.6" y="87.0" font-family="sans-serif" font-size="12.5" fill="#d97706">∠1 = ∠2（AA′ ∥ x 轴，内错角）</text>
<text x="403.6" y="108.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed">∠2 = ∠3（△AFG 等腰）</text>
<text x="403.6" y="129.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">又 |AA′| = |AF|，AP 公共</text>
<text x="403.6" y="150.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">⇒ △A′AP ≅ △FAP（SAS）</text>
<text x="403.6" y="171.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">⇒ ∠PA′A = ∠PFA，|PA′| = |PF|</text>
<text x="403.6" y="192.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">B 侧同理：∠PB′B = ∠PFB，|PB′| = |PF|</text>
