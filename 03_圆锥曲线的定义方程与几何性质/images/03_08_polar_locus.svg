<text x="383.6" y="24.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">弦 AB 绕定点 C(m, n) 转动</text>
<text x="383.6" y="45.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">（三种颜色是三个位置）</text>
<text x="383.6" y="66.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f"></text>
<text x="383.6" y="87.0" font-family="sans-serif" font-size="12.5" fill="#2563eb">P(x₀, y₀) 时 AB：y₀y = p(x + x₀)</text>
<text x="383.6" y="108.0" font-family="sans-serif" font-size="12.5" fill="#2563eb">C 在 AB 上 ⇒ y₀·n = p(m + x₀)</text>
<text x="383.6" y="129.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">换一个 P(x₀′, y₀′) ⇒ y₀′·n = p(m + x₀′)</text>
<text x="383.6" y="150.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">所有 P 都满足同一个式子（同构）</text>
<text x="383.6" y="171.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">⇒ P 的轨迹：ny = p(x + m)（C 的极线）</text>
