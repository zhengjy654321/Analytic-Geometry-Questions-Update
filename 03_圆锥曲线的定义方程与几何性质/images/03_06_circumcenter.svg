<text x="426.0" y="24.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed">k(FA′) = −y₁/p，k(PA) = p/y₁ ⇒ FA′ ⊥ PA</text>
<text x="426.0" y="45.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed">又 |AA′| = |AF| ⇒ PA 是 A′F 的中垂线</text>
<text x="426.0" y="66.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed">同理 PB 是 B′F 的中垂线</text>
<text x="426.0" y="87.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f"></text>
<text x="426.0" y="108.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">⇒ |PA′| = |PF| = |PB′|：</text>
<text x="426.0" y="129.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">P 是 △A′FB′ 的外心（虚线圆）</text>
<text x="426.0" y="150.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">A′、F 关于 PA 对称 ⇒ ∠PFA = ∠PA′A</text>
<text x="426.0" y="171.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">B′、F 关于 PB 对称 ⇒ ∠PFB = ∠PB′B</text>
