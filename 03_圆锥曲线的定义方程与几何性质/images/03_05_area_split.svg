<text x="368.4" y="24.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">PQ ∥ x 轴，把 △PAB 切成上下两块：</text>
<text x="368.4" y="45.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f">两块共底 PQ，高之和 = |y₁ − y₂|</text>
<text x="368.4" y="66.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">S = ½ |PQ| · |y₁ − y₂|</text>
<text x="368.4" y="87.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f"></text>
<text x="368.4" y="108.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">|PQ| = (x₁ + x₂)/2 − y₁y₂/(2p)</text>
<text x="368.4" y="129.0" font-family="sans-serif" font-size="12.5" fill="#0f766e">　　 = (y₁ − y₂)² / (4p)</text>
<text x="368.4" y="150.0" font-family="sans-serif" font-size="12.5" fill="#dc2626">⇒ S = |y₁ − y₂|³ / (8p)</text>
