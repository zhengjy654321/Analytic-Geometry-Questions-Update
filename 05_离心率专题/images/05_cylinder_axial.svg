<text x="204.2" y="189.2" font-family="sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="normal">c</text>
<text x="330.0" y="50.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f" text-anchor="start" font-weight="normal">圆柱的轴截面（两等球，半径 r）</text>
<text x="330.0" y="74.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">切线长：2a = |AB|（切点圆间母线长）</text>
<text x="330.0" y="98.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">ABO₂O₁ 是矩形 ⇒ 2a = |O₁O₂|</text>
<text x="330.0" y="122.0" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">Z 是 O₁O₂、F₁F₂ 的公共中点（对称）</text>
<text x="330.0" y="146.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">|ZO₁| = a，|ZF₁| = c，|O₁F₁| = r</text>
<text x="330.0" y="170.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">Rt△ZF₁O₁：a² = c² + r² ⇒ b = r</text>
<text x="330.0" y="194.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">两球都切底面时：2a = h − 2r</text>
