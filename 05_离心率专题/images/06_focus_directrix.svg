<text x="498.0" y="161.8" font-family="serif" font-size="14" fill="#7c3aed"><tspan font-style="italic">m</tspan></text>
<text x="290.7" y="84.3" font-family="serif" font-size="14" fill="#0891b2"><tspan font-style="italic">π′</tspan></text>
<text x="310.1" y="309.6" font-family="serif" font-size="14" fill="#a16207"><tspan font-style="italic">π</tspan></text>
<text x="520.0" y="30.0" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">π：截面　π′：切点圆所在平面</text>
<text x="520.0" y="55.0" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">m = π ∩ π′（准线）</text>
<text x="520.0" y="80.0" font-family="sans-serif" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">PB ⊥ π′，PB ∥ 轴</text>
<text x="520.0" y="105.0" font-family="sans-serif" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">∠Q₁PB = α ⇒ |PQ₁| = |PB|/cos α</text>
<text x="520.0" y="130.0" font-family="sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="normal">PA ⊥ m，∠APB = β</text>
<text x="520.0" y="155.0" font-family="sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="normal">⇒ |PA| = |PB|/cos β</text>
<text x="520.0" y="180.0" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">|PF| = |PQ₁|</text>
<text x="520.0" y="205.0" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">|PF| : |PA| = cos β : cos α</text>
