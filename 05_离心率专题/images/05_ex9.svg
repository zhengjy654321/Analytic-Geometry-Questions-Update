<text x="370.0" y="40.0" font-family="sans-serif" font-size="12" fill="#1e3a5f" text-anchor="start" font-weight="normal">例 9：r₁ = 4，r₂ = 2，|O₁O₂| = 2√10</text>
<text x="370.0" y="66.0" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">（字母按书上解法：母线切点 B、C，</text>
<text x="370.0" y="92.0" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal"> 截线与 O₁O₂ 交于 D）</text>
<text x="370.0" y="118.0" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">解法一：(2a)² = 40 − 2² = 36，2a = 6</text>
<text x="370.0" y="144.0" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">　　　　(2c)² = 40 − 6² = 4，2c = 2</text>
<text x="370.0" y="170.0" font-family="sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="normal">解法二：△DO₂F ∽ △DO₁E，相似比 1 : 2</text>
<text x="370.0" y="196.0" font-family="sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="normal">|DE| = 4/3，|DF| = 2/3 ⇒ 2c = 2</text>
<text x="370.0" y="222.0" font-family="sans-serif" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">矩形 BGO₂C ⇒ 2a = |BC| = |O₂G| = 6</text>
<text x="370.0" y="248.0" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">e = 2c / 2a = 1/3</text>
