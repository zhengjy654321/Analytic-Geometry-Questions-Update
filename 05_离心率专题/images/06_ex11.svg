<text x="400.0" y="131.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">AD、BE 是两条中线 ⇒ M 为重心</text>
<text x="400.0" y="158.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">cos α = |AD| / |AB| = 2√2 / 3</text>
<text x="400.0" y="185.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">|BE| = 2√17，|MD| = |AD|/3，|BM| = 2|BE|/3</text>
<text x="400.0" y="212.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">cos β = |MD| / |BM| = 2√2 / √17</text>
<text x="400.0" y="239.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">e = cos β / cos α = 3√17 / 17</text>
