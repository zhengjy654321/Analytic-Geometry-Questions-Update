<text x="390.0" y="40.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f" text-anchor="start" font-weight="normal">第一步：求 2a</text>
<text x="390.0" y="64.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">切线长：|MA| = |ME|（一道杠）</text>
<text x="390.0" y="88.0" font-family="sans-serif" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="normal">　　　　|MB| = |MF|（两道杠）</text>
<text x="390.0" y="112.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">2a = |MF| + |ME| = |MB| + |MA| = |AB|</text>
<text x="390.0" y="136.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">ABO₂D 是矩形 ⇒ |O₂D| = |AB| = 2a</text>
<text x="390.0" y="160.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">|O₁D| = r₁ − r₂</text>
<text x="390.0" y="184.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">Rt△O₁DO₂：(2a)² = d² − (r₁ − r₂)²</text>
