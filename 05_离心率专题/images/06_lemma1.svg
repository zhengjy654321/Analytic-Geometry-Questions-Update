<line x1="325.9" y1="67.5" x2="325.9" y2="192.5" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6,3" stroke-linecap="round"/>
<polyline points="325.9,184.5 318.2,186.4 318.2,194.4" fill="none" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M244.2,193.2 A26.0,26.0 0 0,1 255.3,209.1" fill="none" stroke="#d97706" stroke-width="1.4"/>
<text x="260.3" y="197.7" font-family="serif" font-size="13" fill="#d97706" text-anchor="middle">β</text>
<circle cx="230.0" cy="215.0" r="3" fill="#1e293b"/>
<circle cx="325.9" cy="67.5" r="3" fill="#1e293b"/>
<circle cx="325.9" cy="192.5" r="3" fill="#1e293b"/>
<text x="212.0" y="229.0" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">K</tspan></text>
<text x="333.9" y="67.5" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">S</tspan></text>
<text x="331.9" y="208.5" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">T</tspan></text>
<text x="346.3" y="45.4" font-family="serif" font-size="13" fill="#7c3aed"><tspan font-style="italic">l（轴）</tspan></text>
<text x="368.3" y="199.6" font-family="serif" font-size="13" fill="#dc2626"><tspan font-style="italic">MN = σ ∩ π</tspan></text>
<text x="165.9" y="267.7" font-family="serif" font-size="14" fill="#a16207"><tspan font-style="italic">π</tspan></text>
<text x="124.1" y="110.3" font-family="serif" font-size="14" fill="#0891b2"><tspan font-style="italic">σ</tspan></text>
<text x="430.0" y="40.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f" text-anchor="start" font-weight="normal">σ 过轴 l 且 σ ⊥ π</text>
<text x="430.0" y="66.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">在 σ 内作 ST ⊥ MN</text>
<text x="430.0" y="92.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">σ ⊥ π ⇒ ST ⊥ π（面面垂直性质）</text>
<text x="430.0" y="118.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">⇒ KT 是 l 在 π 内的射影</text>
<text x="430.0" y="144.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">⇒ 线面角 = ∠SKT = β</text>
<text x="430.0" y="170.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">即轴截面里截线与轴的夹角</text>
</svg>
