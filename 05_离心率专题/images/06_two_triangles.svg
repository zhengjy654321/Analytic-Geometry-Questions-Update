<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
<rect width="700" height="300" fill="#ffffff"/>
<polygon points="180.0,250.0 180.0,70.0 96.1,70.0" fill="#0f766e" fill-opacity="0.15" stroke="#0f766e" stroke-width="0.8"/>
<polygon points="180.0,250.0 180.0,70.0 437.1,70.0" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="0.8"/>
<line x1="180.0" y1="250.0" x2="96.1" y2="70.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/>
<line x1="180.0" y1="250.0" x2="437.1" y2="70.0" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>
<line x1="180.0" y1="250.0" x2="180.0" y2="70.0" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="96.1" y1="70.0" x2="437.1" y2="70.0" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" stroke-linecap="round"/>
<polyline points="180.0,79.0 171.0,79.0 171.0,70.0" fill="none" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="180.0,79.0 189.0,79.0 189.0,70.0" fill="none" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M165.6,219.2 A34.0,34.0 0 0,1 180.0,216.0" fill="none" stroke="#0f766e" stroke-width="1.4"/>
<text x="170.3" y="210.1" font-family="serif" font-size="13" fill="#0f766e" text-anchor="middle">α</text>
<path d="M180.0,224.0 A26.0,26.0 0 0,1 201.3,235.1" fill="none" stroke="#d97706" stroke-width="1.4"/>
<text x="197.1" y="221.2" font-family="serif" font-size="13" fill="#d97706" text-anchor="middle">β</text>
<circle cx="180.0" cy="250.0" r="3" fill="#1e293b"/>
<circle cx="180.0" cy="70.0" r="3" fill="#1e293b"/>
<circle cx="96.1" cy="70.0" r="3" fill="#1e293b"/>
<circle cx="437.1" cy="70.0" r="3" fill="#1e293b"/>
<text x="174.0" y="270.0" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">P</tspan></text>
<text x="174.0" y="62.0" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">B</tspan></text>
<text x="74.1" y="64.0" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">Q</tspan><tspan dy="4" font-size="10">1</tspan></text>
<text x="443.1" y="64.0" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">A</tspan></text>
<text x="470.0" y="60.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f" text-anchor="start" font-weight="normal">两个直角三角形共用直角边 PB</text>
<text x="470.0" y="88.0" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">（实际在两个平面里，此处摊平）</text>
<text x="470.0" y="116.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">|PQ₁| = |PB| / cos α</text>
<text x="470.0" y="144.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">|PA| = |PB| / cos β</text>
<text x="470.0" y="172.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">|PF| / |PA| = |PQ₁| / |PA|</text>
<text x="470.0" y="200.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">　　　 = cos β / cos α</text>
</svg>
