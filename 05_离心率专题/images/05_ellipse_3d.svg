<text x="470.0" y="40.0" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">两球在同一叶内，分居截面两侧</text>
<text x="470.0" y="64.0" font-family="sans-serif" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="normal">两条青色圆：两球与侧面的切点圆</text>
<text x="470.0" y="88.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">过 P 的母线交两切点圆于 A′、B′</text>
<text x="470.0" y="112.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">|PE| = |PA′|（同一球的两条切线）</text>
<text x="470.0" y="136.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">|PF| = |PB′|</text>
<text x="470.0" y="160.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">|PE| + |PF| = |A′B′| = 定值 2a</text>
<text x="470.0" y="184.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">E、F 就是椭圆的两个焦点</text>
