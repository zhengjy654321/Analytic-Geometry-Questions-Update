<text x="470.0" y="112.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">交两切点圆于 Q₁、Q₂</text>
<text x="470.0" y="136.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">|PF₁| = |PQ₁|，|PF₂| = |PQ₂|</text>
<text x="470.0" y="160.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">|PF₁| − |PF₂| = |Q₁Q₂| = 定值 2a</text>
<text x="470.0" y="184.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">F₁、F₂ 是双曲线的两个焦点</text>
