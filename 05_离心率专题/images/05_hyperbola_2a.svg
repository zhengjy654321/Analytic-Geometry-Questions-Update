<text x="345.0" y="40.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f" text-anchor="start" font-weight="normal">双曲线第一步：求 2a</text>
<text x="345.0" y="64.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">|PF₁| = |PQ₁|，|PF₂| = |PQ₂|</text>
<text x="345.0" y="88.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">2a = |PQ₁| − |PQ₂| = |Q₁Q₂|</text>
<text x="345.0" y="112.0" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">两圆在母线 Q₁Q₂ 的两侧</text>
<text x="345.0" y="136.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">Q₁Q₂O₂D 是矩形 ⇒ |O₂D| = 2a</text>
<text x="345.0" y="160.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">|O₁D| = r₁ + r₂</text>
<text x="345.0" y="184.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">Rt△O₁DO₂：(2a)² = d² − (r₁ + r₂)²</text>
