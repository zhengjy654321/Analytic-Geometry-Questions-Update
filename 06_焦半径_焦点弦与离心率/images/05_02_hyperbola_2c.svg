<text x="345.0" y="160.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">|O₂H| = r₂ − r₁</text>
<text x="345.0" y="184.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">Rt△O₁HO₂：(2c)² = d² − (r₁ − r₂)²</text>
