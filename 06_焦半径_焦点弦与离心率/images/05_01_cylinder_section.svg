<text x="236.1" y="63.4" font-family="serif" font-size="13" fill="#7c3aed" text-anchor="middle">β</text>
<circle cx="54.0" cy="302.1" r="3" fill="#1e293b"/>
<circle cx="246.0" cy="27.9" r="3" fill="#1e293b"/>
<circle cx="150.0" cy="165.0" r="3" fill="#1e293b"/>
<text x="32.0" y="308.1" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">M</tspan></text>
<text x="254.0" y="27.9" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">N</tspan></text>
<text x="132.0" y="179.0" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">O</tspan></text>
<text x="150.0" y="320.1" font-family="sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">2r = 2b</text>
<text x="124.0" y="157.0" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="normal">2a</text>
<text x="330.0" y="60.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f" text-anchor="start" font-weight="normal">圆柱轴截面（α = 0）</text>
<text x="330.0" y="84.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">短轴 = 圆柱直径：b = r</text>
<text x="330.0" y="108.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">长轴 MN = 2a，MN 与轴成角 β</text>
<text x="330.0" y="132.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">Rt△ 中 ∠MNH = β（与轴平行）</text>
<text x="330.0" y="156.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">sin β = 2b / 2a = b / a</text>
<text x="330.0" y="180.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">e² = 1 − b²/a² = 1 − sin²β = cos²β</text>
<text x="330.0" y="204.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">⇒ e = cos β</text>
<text x="252.0" y="316.1" font-family="serif" font-size="14" fill="#1e293b"><tspan font-style="italic">H</tspan></text>
</svg>
