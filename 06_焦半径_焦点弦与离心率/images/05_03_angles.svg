<text x="545.0" y="60.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">O₂D ∥ AB（母线），O₁O₂ 在轴上</text>
<text x="545.0" y="86.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">⇒ ∠O₁O₂D = 母线与轴的夹角 = α</text>
<text x="545.0" y="112.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">cos α = |O₂D| / |O₁O₂| = 2a / d</text>
<text x="545.0" y="138.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">O₂C ∥ EF（截线），O₁O₂ 在轴上</text>
<text x="545.0" y="164.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">⇒ ∠O₁O₂C = 截线与轴的夹角 = β</text>
<text x="545.0" y="190.0" font-family="sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="normal">cos β = |O₂C| / |O₁O₂| = 2c / d</text>
<text x="545.0" y="216.0" font-family="sans-serif" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="normal">e = 2c / 2a = cos β / cos α</text>
