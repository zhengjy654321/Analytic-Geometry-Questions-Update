<text x="390.0" y="40.0" font-family="sans-serif" font-size="12.5" fill="#1e3a5f" text-anchor="start" font-weight="normal">第二步：求 2c</text>
<text x="390.0" y="64.0" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">两圆在截线 MN 的两侧</text>
<text x="390.0" y="88.0" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">O₁E ⊥ MN，O₂F ⊥ MN</text>
<text x="390.0" y="112.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">过 O₂ 作 O₂C ⊥ O₁E 的延长线</text>
<text x="390.0" y="136.0" font-family="sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="normal">CEFO₂ 是矩形 ⇒ 2c = |EF| = |O₂C|</text>
<text x="390.0" y="160.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">|O₁C| = |O₁E| + |EC| = r₁ + r₂</text>
<text x="390.0" y="184.0" font-family="sans-serif" font-size="12.5" fill="#d97706" text-anchor="start" font-weight="normal">Rt△O₁CO₂：(2c)² = d² − (r₁ + r₂)²</text>
